[project]
name = 'ecpmodel'
version = '0.1.0'
description = 'Public-data state-space model of the European ethylene contract price (ECP)'
readme = 'README.md'
requires-python = '>=3.11'
dependencies = [
  'pandas>=2.1',
  'numpy>=1.26',
  'scipy>=1.11',
  'statsmodels>=0.14',
  'pyarrow',
  'requests',
  'pyyaml',
  'eurostat',
  'arviz',
  'matplotlib',
  'pandera',
  'typer',
  'tqdm',
]

[project.optional-dependencies]
bayes = ['pymc>=5', 'pytensor']
bulk = ['py7zr']
dev = ['pytest', 'ruff', 'jupyter']

[build-system]
requires = ['setuptools>=68']
build-backend = 'setuptools.build_meta'

[tool.setuptools.packages.find]
where = ['src']

[tool.pytest.ini_options]
testpaths = ['tests']
filterwarnings = ['ignore::DeprecationWarning']

[tool.ruff]
line-length = 100
target-version = 'py311'

[tool.ruff.lint]
select = ['E', 'F', 'W', 'I', 'UP', 'B']
ignore = ['E741']

[tool.ruff.lint.per-file-ignores]
'__init__.py' = ['F401']